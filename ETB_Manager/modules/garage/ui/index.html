<div class="lamp-panel">
  <section class="panel-card">
    <div class="eyebrow">BOTTOMFLOOR · LAMPADAIRES</div>
    <div class="lamp-state-line">
      <span class="lamp-state-dot" id="lampStateDot"></span>
      <strong id="lampState">En attente</strong>
    </div>
    <div class="lamp-next">
      <span>Prochaine extinction</span>
      <strong id="lampCountdown">—</strong>
      <small class="lamp-window" id="lampWindow"></small>
      <small class="lamp-window" id="lampLead"></small>
    </div>
    <div class="timer-actions">
      <button class="secondary-button" id="lampClear">Réinitialiser la calibration</button>
    </div>
  </section>
  <section class="panel-card lamp-details">
    <div class="metric-row"><span>Lampadaires détectés</span><strong id="lampCount">0</strong></div>
    <div class="metric-row"><span>Délai allumé estimé</span><strong id="lampPeriod">—</strong></div>
    <div class="metric-row"><span>Fiabilité</span><strong id="lampQuality">—</strong></div>
    <div class="metric-row"><span>Extinctions détectées</span><strong id="lampEvents">0</strong></div>
    <div class="metric-row"><span>Dernières coupures (★ = extinction)</span><strong id="lampOffs">—</strong></div>
    <div class="metric-row" id="lampRejectedRow" hidden><span>Mesures hors plage</span><strong class="lamp-warn" id="lampRejected">0</strong></div>
    <label class="player-setting">Joueurs
      <select id="lampPlayers"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="Inconnu">Inconnu (4–8 s)</option></select>
    </label>
    <p class="lamp-message" id="lampStatus">Suivi mémoire automatique au chargement du module.</p>
  </section>
  <section class="panel-card">
    <div class="eyebrow">ÉTAT INDIVIDUEL</div>
    <div class="lamp-list" id="lampRows"><span class="muted">Aucun lampadaire détecté.</span></div>
  </section>
</div>
